<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cloudGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(15px, -10px); opacity: 0.65; }
    }
    @keyframes floatPhone1 {
      0%, 100% { transform: translateY(0px) rotate(-3deg); }
      50% { transform: translateY(-14px) rotate(-1deg); }
    }
    @keyframes floatPhone2 {
      0%, 100% { transform: translateY(0px) rotate(4deg); }
      50% { transform: translateY(-18px) rotate(2deg); }
    }
    @keyframes waveFlow {
      0% { transform: translateX(0); }
      50% { transform: translateX(-50px); }
      100% { transform: translateX(0); }
    }
    @keyframes pingDot {
      0%, 100% { opacity: 0.3; r: 3; }
      50% { opacity: 1; r: 5.5; }
    }
    @keyframes shimmer {
      0% { stop-color: #38bdf8; }
      50% { stop-color: #c084fc; }
      100% { stop-color: #38bdf8; }
    }
    .orb1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 260px; }
    .phone-mockup-1 { animation: floatPhone1 6s ease-in-out infinite; }
    .phone-mockup-2 { animation: floatPhone2 7s ease-in-out infinite 1s; }
    .flow-wave { animation: waveFlow 12s ease-in-out infinite; }
    .ping-1 { animation: pingDot 3s ease-in-out infinite; }
    .ping-2 { animation: pingDot 3s ease-in-out infinite 1.5s; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic Glowing Atmospheric Orbs (Background layer) -->
  <circle class="orb1" cx="200" cy="90" r="140" fill="url(#cloudGlow)" filter="url(#glow)" />
  <circle class="orb2" cx="1020" cy="270" r="160" fill="url(#cloudGlow)" filter="url(#glow)" />

  <!-- Animated Grid / Network Flow Lines in Background -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" class="flow-wave">
    <path d="M-50,60 C250,140 450,20 750,100 C1050,180 1150,80 1300,120" fill="none" />
    <path d="M-50,180 C200,240 500,120 800,220 C1050,300 1200,190 1300,230" fill="none" />
    <path d="M-50,300 C300,320 600,240 900,310 C1100,350 1200,280 1300,300" fill="none" />
  </g>

  <!-- Left Dynamic Floating Phone Graphic (Android / Cloud Node) -->
  <g class="phone-mockup-1" transform="translate(100, 60)">
    <!-- Device Body -->
    <rect x="0" y="0" width="105" height="205" rx="18" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="2" filter="url(#subtleGlow)" />
    <!-- Notch/Speaker -->
    <rect x="35" y="8" width="35" height="4" rx="2" fill="#38bdf8" opacity="0.6" />
    <!-- Screen View -->
    <rect x="8" y="20" width="89" height="165" rx="8" fill="#090d16" />
    <!-- Screen Elements -->
    <rect x="18" y="32" width="55" height="8" rx="3" fill="#38bdf8" opacity="0.7" />
    <rect x="18" y="46" width="70" height="6" rx="2" fill="#94a3b8" opacity="0.4" />
    <circle cx="28" cy="74" r="10" fill="#818cf8" opacity="0.5" />
    <rect x="44" y="68" width="42" height="6" rx="2" fill="#94a3b8" opacity="0.5" />
    <rect x="44" y="78" width="28" height="4" rx="2" fill="#94a3b8" opacity="0.3" />
    <!-- Device Signal Node -->
    <circle class="ping-1" cx="52" cy="140" r="4" fill="#34d399" />
    <text x="52" y="160" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600">CONNECTED</text>
  </g>

  <!-- Right Dynamic Floating Phone Graphic (iOS / Device Farm Node) -->
  <g class="phone-mockup-2" transform="translate(980, 75)">
    <!-- Device Body -->
    <rect x="0" y="0" width="105" height="205" rx="20" fill="url(#cardGrad1)" stroke="#c084fc" stroke-width="2" filter="url(#subtleGlow)" />
    <!-- Dynamic Island / Speaker -->
    <rect x="32" y="8" width="40" height="7" rx="3.5" fill="#030712" stroke="#c084fc" stroke-width="0.8" />
    <!-- Screen View -->
    <rect x="8" y="20" width="89" height="165" rx="10" fill="#090d16" />
    <!-- UI Layout -->
    <rect x="18" y="36" width="60" height="9" rx="3" fill="#c084fc" opacity="0.7" />
    <circle cx="52" cy="82" r="22" fill="#c084fc" opacity="0.15" stroke="#c084fc" stroke-width="1.5" />
    <path d="M47 82 L51 86 L58 78" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
    <!-- Device Signal Node -->
    <circle class="ping-2" cx="52" cy="135" r="4" fill="#38bdf8" />
    <text x="52" y="155" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600">APP AUTOMATE</text>
  </g>

  <!-- FOREGROUND CONTENT: Header Title, Subtitle, and Feature Badges (Always in foreground) -->
  <g id="foreground-content">
    <!-- Top Pill Tag -->
    <g transform="translate(600, 52)">
      <rect x="-145" y="-14" width="290" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
      <circle cx="-124" cy="0" r="4.5" fill="#34d399" />
      <text x="-110" y="4" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1">CURATED TESTING REPOSITORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="900" fill="url(#accentGrad)" letter-spacing="-0.5">
      Awesome Real Mobile Device Cloud
    </text>

    <!-- Subtitle -->
    <text x="600" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#e2e8f0" opacity="0.92">
      Enterprise Device Farms, Cloud Testing Platforms &amp; Self-Hosted Open-Source Infrastructure
    </text>

    <!-- Secondary Tagline -->
    <text x="600" y="202" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#94a3b8">
      iOS &amp; Android Real Devices &bull; Appium Grid &bull; Automated &amp; Manual QA &bull; AI Agent MCP Testing
    </text>

    <!-- Bottom Feature Pills in Foreground -->
    <g transform="translate(600, 260)">
      <!-- Pill 1: SaaS Farms -->
      <g transform="translate(-245, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
        <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">☁️ SaaS Farms</text>
      </g>
      <!-- Pill 2: Open Source -->
      <g transform="translate(-80, 0)">
        <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="1.2" />
        <text x="0" y="4" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">💻 Open-Source</text>
      </g>
      <!-- Pill 3: Appium Grids -->
      <g transform="translate(85, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
        <text x="0" y="4" text-anchor="middle" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ Appium Grids</text>
      </g>
      <!-- Pill 4: AI Agents -->
      <g transform="translate(240, 0)">
        <rect x="-60" y="-16" width="120" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" />
        <text x="0" y="4" text-anchor="middle" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🤖 AI MCP Tools</text>
      </g>
    </g>

    <!-- Bottom Status Text -->
    <text x="600" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">
      Updated for 2026 &bull; Production Benchmarks &bull; Pricing &amp; Free Tier Comparisons
    </text>
  </g>
</svg>
